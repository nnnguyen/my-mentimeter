services:
  postgres:
    image: postgres:16-alpine
    container_name: mentimeter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mentimeter
      POSTGRES_PASSWORD: mentimeter
      POSTGRES_DB: mentimeter
    ports:
      # host 5433 -> container 5432 (host may already have a local Postgres on 5432)
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mentimeter -d mentimeter']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
